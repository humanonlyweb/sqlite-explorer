name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package all targets
        run: bun run package all

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/*.vsix --title "${{ github.ref_name }}" --generate-notes

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: |
          for vsix in release/*.vsix; do
            bunx @vscode/vsce publish --packagePath "$vsix"
          done

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: |
          for vsix in release/*.vsix; do
            bunx ovsx publish "$vsix"
          done
